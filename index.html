
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECORIQ - Save Your Company</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#081525;color:#fff;font-family:Arial,sans-serif}
main{max-width:650px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{color:#52d7bd;font-size:27px;font-weight:900;letter-spacing:2px}
.timer{background:#a42b39;padding:12px 17px;border-radius:12px;font-size:22px;font-weight:bold}
h1{font-size:clamp(30px,7vw,49px);line-height:1.05;margin:18px 0;color:#fff}
.subtitle{color:#c4d3e5;line-height:1.5}
.panel{background:#152a43;border:1px solid #304661;border-radius:18px;padding:22px;margin:18px 0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{background:#0c1c30;padding:15px;border-radius:12px}
.small{font-size:12px;color:#9fb4ca;text-transform:uppercase}
.value{font-size:26px;font-weight:bold;margin-top:7px}
.danger{color:#ff737d}
.good{color:#52d7bd}
button{width:100%;text-align:left;background:#23415d;color:white;border:1px solid #42627d;border-radius:13px;padding:17px;margin:8px 0;cursor:pointer;font-size:16px}
button:hover{background:#305a77}
button:disabled{opacity:.5;cursor:default}
button strong{display:block;margin-bottom:5px}
button span{font-size:13px;color:#d0dce8}
#message{line-height:1.6}
.hidden{display:none}
.center{text-align:center}
.restart{background:#52d7bd;color:#082134;text-align:center;font-weight:bold}
.progress{height:7px;background:#263a50;border-radius:10px;overflow:hidden}
#bar{height:100%;width:100%;background:#52d7bd;transition:width .3s}
</style>
</head>
<body>
<main>
<header>
<div class="logo">VECORIQ</div>
<div class="timer" id="timer">60s</div>
</header>
<div class="progress"><div id="bar"></div></div>

<section id="game">
<p class="small" id="round">CRISIS MODE · DECISION 1/3</p>
<h1 id="headline">YOUR COMPANY IS DYING!</h1>
<p class="subtitle" id="story">
Your biggest client just left. Salaries are due tomorrow.
You have $100,000. Make your move.
</p>

<div class="metrics">
<div class="metric">
<div class="small">COMPANY CASH</div>
<div class="value" id="cash">$100,000</div>
</div>
<div class="metric">
<div class="small">REPUTATION</div>
<div class="value" id="reputation">60/100</div>
</div>
</div>

<div class="panel">
<h2 id="question">WHAT WILL YOU DO?</h2>
<div id="choices"></div>
<p id="message"></p>
</div>
</section>

<section id="ending" class="panel hidden center">
<p class="small">VECORIQ · FINAL RESULT</p>
<h1 id="endingTitle"></h1>
<p id="endingText"></p>
<div class="value" id="endingCash"></div>
<p id="endingDetails"></p>
<button class="restart" onclick="startGame()">PLAY AGAIN</button>
<button onclick="shareResult()">CHALLENGE A FRIEND</button>
</section>
</main>

<script>
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const scenarios=[
{
headline:"YOUR COMPANY IS DYING!",
story:"Your biggest client just left. Salaries are due tomorrow. You have $100,000. Make your move.",
question:"HOW WILL YOU SURVIVE?",
choices:[
{title:"LAUNCH A NEW PRODUCT",detail:"Spend $60,000. High risk, high potential.",cash:-60000,rep:8,flag:"product"},
{title:"FIND AN INVESTOR",detail:"Raise $80,000, sell 30% of your company.",cash:80000,rep:3,flag:"investor"},
{title:"CUT COSTS",detail:"Save $25,000, but damage team morale.",cash:25000,rep:-18,flag:"cuts"}
]
},
{
headline:"BREAKING: THE MARKET JUST CHANGED!",
story:"A competitor slashes prices. Customers are leaving. Your next move could save everything.",
question:"WHAT IS YOUR RESPONSE?",
choices:[
{title:"FIGHT ON PRICE",detail:"Spend $35,000 to win customers back.",cash:-35000,rep:12,flag:"price"},
{title:"FOCUS ON QUALITY",detail:"Invest $20,000 in a premium offer.",cash:-20000,rep:15,flag:"quality"},
{title:"PROTECT YOUR CASH",detail:"Delay expansion and reduce spending.",cash:10000,rep:-8,flag:"protect"}
]
},
{
headline:"FINAL MOVE: THE BIG OPPORTUNITY!",
story:"A major customer offers a contract. Can your company deliver?",
question:"MAKE YOUR FINAL DECISION.",
choices:[
{title:"TAKE THE BIG CONTRACT",detail:"High revenue, but expensive delivery.",cash:-30000,rep:5,flag:"contract"},
{title:"GROW SLOWLY",detail:"Smaller deal, more predictable costs.",cash:15000,rep:5,flag:"steady"},
{title:"SELL A STAKE",detail:"Raise $50,000, give away 20% ownership.",cash:50000,rep:0,flag:"stake"}
]
}
];

let cash,rep,ownership,step,history,seconds,interval,active;

function startGame(){
clearInterval(interval);
cash=100000;rep=60;ownership=100;
step=0;history=[];seconds=60;active=true;
document.getElementById("game").classList.remove("hidden");
document.getElementById("ending").classList.add("hidden");
updateMetrics();
showStep();
tick();
interval=setInterval(()=>{
if(!active)return;
seconds--;
tick();
if(seconds<=0)finish(true);
},1000);
}

function tick(){
document.getElementById("timer").textContent=seconds+"s";
document.getElementById("bar").style.width=(seconds/60*100)+"%";
}

function updateMetrics(){
document.getElementById("cash").textContent=money(cash);
document.getElementById("reputation").textContent=rep+"/100";
}

function showStep(){
const s=scenarios[step];
document.getElementById("round").textContent=
"CRISIS MODE · DECISION "+(step+1)+"/3";
document.getElementById("headline").textContent=s.headline;
document.getElementById("story").textContent=s.story;
document.getElementById("question").textContent=s.question;
document.getElementById("message").textContent="";
const area=document.getElementById("choices");
area.innerHTML="";
s.choices.forEach((c,i)=>{
const b=document.createElement("button");
const strong=document.createElement("strong");
strong.textContent=String.fromCharCode(65+i)+". "+c.title;
const detail=document.createElement("span");
detail.textContent=c.detail;
b.append(strong,detail);
b.onclick=()=>choose(c);
area.appendChild(b);
});
}

function choose(c){
if(!active)return;
cash+=c.cash;
rep=Math.max(0,Math.min(100,rep+c.rep));
if(c.flag==="investor")ownership-=30;
if(c.flag==="stake")ownership-=20;
history.push(c.flag);
updateMetrics();

if(step===2){
finish(false);
return;
}
step++;
showStep();
}

function finish(timedOut){
if(!active)return;
active=false;
clearInterval(interval);

let operatingReturn=0;
if(!timedOut){
if(history.includes("product"))operatingReturn+=85000;
if(history.includes("price"))operatingReturn+=47000;
if(history.includes("quality"))operatingReturn+=42000;
if(history.includes("contract"))operatingReturn+=65000;
if(history.includes("steady"))operatingReturn+=18000;
if(history.includes("cuts"))operatingReturn-=12000;
if(history.includes("protect"))operatingReturn-=15000;
cash+=operatingReturn;
}
const survived=!timedOut&&cash>0&&rep>=30;
document.getElementById("game").classList.add("hidden");
document.getElementById("ending").classList.remove("hidden");
document.getElementById("endingTitle").textContent=
timedOut?"TIME IS UP!":survived?"YOU SAVED THE COMPANY!":"YOUR COMPANY COLLAPSED!";
document.getElementById("endingText").textContent=
timedOut?"The board removed you before you could complete your plan.":
survived?"Your strategy kept the business alive. Can you do better?":
"Your decisions left the company without a viable future.";
document.getElementById("endingCash").textContent=money(cash);
document.getElementById("endingDetails").textContent=
"Reputation: "+rep+"/100 · Your ownership: "+ownership+"%"+
(!timedOut?" · Operating result: "+money(operatingReturn):"");
}

async function shareResult(){
const title=document.getElementById("endingTitle").textContent;
const message="I played VECORIQ: "+title+
" Final cash: "+money(cash)+
". Can you beat my result?";
if(navigator.share){
try{await navigator.share({title:"VECORIQ",text:message});}
catch(e){}
}else if(navigator.clipboard&&window.isSecureContext){
try{await navigator.clipboard.writeText(message);
alert("Challenge copied!");}
catch(e){prompt("Copy your challenge:",message);}
}else{
prompt("Copy your challenge:",message);
}
}

startGame();
</script>
</body>
</html>
